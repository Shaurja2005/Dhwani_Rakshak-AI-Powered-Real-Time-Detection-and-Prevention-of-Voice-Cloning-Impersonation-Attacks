# VoiceGuard dev stack — ports are canonical per SOURCE_OF_TRUTH.md §11
# Run with: make dev-up
# Tear down: make dev-down
# NOTE: This is dev only. For prod, see docker-compose.prod.yml (B17-T02).

version: "3.9"

networks:
  vg-dev:
    name: vg-dev

volumes:
  pg_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL + TimescaleDB — score timelines, sessions, evidence bundles
  # Port 5432 / env prefix VG_DB_
  # ---------------------------------------------------------------------------
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: vg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vg
      POSTGRES_PASSWORD: vg
      POSTGRES_DB: vg
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./deploy/init_db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vg"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - vg-dev

  # ---------------------------------------------------------------------------
  # Redis — per-window feature cache (B2-T08), pub/sub bus (B0-T04)
  # Port 6379 / env prefix VG_REDIS_
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: vg-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - vg-dev

  # ---------------------------------------------------------------------------
  # MinIO — object storage for flagged audio (short retention) and artifacts
  # Port 9000 (API) / 9001 (Console) / env prefix VG_S3_
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: vg-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vg-dev

  # MinIO bucket init (idempotent)
  minio-init:
    image: minio/mc:latest
    container_name: vg-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/vg-audio &&
        mc mb --ignore-existing local/vg-evidence &&
        mc mb --ignore-existing local/vg-models &&
        mc policy set download local/vg-models &&
        echo 'MinIO buckets ready'
      "
    networks:
      - vg-dev

  # ---------------------------------------------------------------------------
  # Prometheus — metrics scraping
  # Port 9090
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: vg-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - vg-dev

  # ---------------------------------------------------------------------------
  # Grafana — dashboards (ops + fraud analytics)
  # Port 3001 (not 3000, which is reserved for the UI per SoT §11)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana-oss:latest
    container_name: vg-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_PORT: "3001"
    ports:
      - "3001:3001"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/observability/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      - prometheus
    networks:
      - vg-dev
