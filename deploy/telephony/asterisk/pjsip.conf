; VoiceGuard Asterisk PJSIP configuration
; B1-T03 — deploy/telephony/asterisk/pjsip.conf
;
; Requirements: Asterisk 20+, chan_pjsip, res_audiosocket
;
; Two test softphone accounts (Linphone, Zoiper) for dev:
;   vg_caller  : initiates calls
;   vg_callee  : receives calls (the "agent" extension)
; The dialplan in extensions.conf forks audio to VoiceGuard via AudioSocket.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=auto
local_net=192.168.0.0/16
local_net=10.0.0.0/8
local_net=172.16.0.0/12

[vg_caller]
type=endpoint
transport=transport-udp
context=voiceguard
disallow=all
allow=ulaw
allow=slin16
auth=vg_caller_auth
aors=vg_caller_aor
callerid="VG Caller" <1001>

[vg_caller_auth]
type=auth
auth_type=userpass
password=vgtest123
username=vg_caller

[vg_caller_aor]
type=aor
max_contacts=2
qualify_frequency=30

[vg_callee]
type=endpoint
transport=transport-udp
context=voiceguard
disallow=all
allow=ulaw
allow=slin16
auth=vg_callee_auth
aors=vg_callee_aor
callerid="VG Callee" <1002>

[vg_callee_auth]
type=auth
auth_type=userpass
password=vgtest456
username=vg_callee

[vg_callee_aor]
type=aor
max_contacts=2
qualify_frequency=30
