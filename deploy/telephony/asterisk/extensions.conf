; VoiceGuard Asterisk dialplan
; B1-T03 — deploy/telephony/asterisk/extensions.conf
;
; This dialplan:
;   1. Answers inbound calls on extension 1002 (agent).
;   2. Forces the channel audio format to slin16 (16-bit signed linear, 8kHz).
;   3. Forks audio to VoiceGuard via AudioSocket (tcp:VOICEGUARD_HOST:9092).
;   4. Bridges the call normally.
;
; VOICEGUARD_HOST: IP of the machine running services/ingest/main.py
; Replace 192.168.1.100 with your actual host IP.

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
VOICEGUARD_HOST=192.168.1.100
VOICEGUARD_PORT=9092

[voiceguard]
; Inbound call to agent (extension 1002)
exten => 1002,1,NoOp(VoiceGuard hook: inbound call from ${CALLERID(num)})
 same => n,Answer()
 ; Force slin16 so AudioSocket gets raw PCM (no codec negotiation surprises)
 same => n,Set(CHANNEL(audioreadformat)=slin16)
 same => n,Set(CHANNEL(audiowriteformat)=slin16)
 ; Fork the audio to VoiceGuard (non-blocking — call continues if VG unreachable)
 same => n,AGI(agi://localhost/vg_hook,${CALLERID(num)},${EXTEN})
 ; AudioSocket sends audio to VoiceGuard ingest
 same => n,Set(VG_RESULT=${AUDIOSOCKET(${VOICEGUARD_HOST}:${VOICEGUARD_PORT})})
 same => n,Dial(PJSIP/vg_callee,30)
 same => n,Hangup()

; Fallback: extension not found
exten => _X.,1,NoOp(Unknown extension ${EXTEN})
 same => n,Playback(invalid)
 same => n,Hangup()

; h extension — called on hangup (cleanup)
exten => h,1,NoOp(Call ended: ${UNIQUEID})
