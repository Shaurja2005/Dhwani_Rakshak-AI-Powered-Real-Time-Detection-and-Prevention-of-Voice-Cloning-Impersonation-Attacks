apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: TimescaleDB
    type: postgres
    access: proxy
    url: postgres:5432
    database: vg
    user: vg
    secureJsonData:
      password: vg
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
    editable: false
