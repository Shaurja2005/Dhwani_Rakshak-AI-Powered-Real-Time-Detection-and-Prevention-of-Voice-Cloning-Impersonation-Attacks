name: eval
# B15-T10: regenerate docs/benchmarks/REPORT.md for a model version.
#  * harness-smoke: every change to the harness or the model registry runs the full
#    harness on synthetic data (proves `make eval` works unattended; numbers unused).
#  * full-eval: real evaluation runs only on a self-hosted runner that holds the
#    eval data — audio never leaves the premises (I6), In-the-Wild stays eval-only.
on:
  push:
    branches: [main]
    paths: ["models/released.yaml", "ml/eval/**", "packages/vg_eval/**"]
  workflow_dispatch:
    inputs:
      model:
        description: "Model spec or registered version (e.g. head_a:runs/x.pt, A@xlsr300m-nes2net-v0.3.1)"
        required: true

jobs:
  harness-smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]" pandas matplotlib
      - name: Synthetic end-to-end run
        run: python ml/eval/run_eval.py --model baseline:flatness --synthetic --config ml/eval/configs/smoke.yaml
      - uses: actions/upload-artifact@v4
        with: {name: eval-smoke, path: runs/eval/smoke/}

  full-eval:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, voiceguard-eval]   # holds data/ and models/; no egress needed
    steps:
      - uses: actions/checkout@v4
      - name: Evaluate
        run: make eval MODEL="${{ inputs.model }}"
      - name: Propose the regenerated report
        uses: peter-evans/create-pull-request@v6
        with:
          branch: eval/${{ github.run_id }}
          title: "B15: benchmark report for ${{ inputs.model }}"
          body: "Regenerated by the eval workflow. Every number cites a row id in docs/benchmarks/REPORT.md."
          add-paths: |
            docs/benchmarks/REPORT.md
            docs/benchmarks/runs/*.json
