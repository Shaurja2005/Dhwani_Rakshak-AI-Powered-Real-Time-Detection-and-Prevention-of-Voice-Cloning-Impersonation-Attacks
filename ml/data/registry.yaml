# Dataset registry (B3-T01). Authoritative per SOURCE_OF_TRUTH.md §8.
#
# Every entry MUST declare `commercial_use: true|false` (invariant I7).
# Policy: when a license has not been verified by a human, commercial_use is
# `false`. Flip it only after reading the EULA, and record who checked it in
# `license_checked_by`.
#
# Fields
#   name              unique id, used as data/raw/<name>/
#   kind              spoof_corpus | bona_fide | augmentation
#   role              train | train_research | eval_only | comparability | augmentation | bona_fide_source
#   license           SPDX id or a short description
#   commercial_use    bool (enforced by ml/data/license_gate.py)
#   license_checked_by  person who verified the license, or null
#   access            public | eula | gated_hf | request_form
#   url               landing page or direct download
#   size_gb           approximate
#   languages         list of ISO 639-1 codes
#   files             list of {name, url, sha256}; sha256 null until pinned after first verified download
#   notes             free text

