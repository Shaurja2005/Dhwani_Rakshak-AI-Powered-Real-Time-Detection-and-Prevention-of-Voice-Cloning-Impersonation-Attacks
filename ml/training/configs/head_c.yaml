# B6 Head C prosody model. CPU is fine.
run_name: head_c_v1
lineage: research
allow_noncommercial: true
seed: 1337
out_dir: runs
version: 0.1.0

data:
  manifests: data/manifests/*.jsonl
  splits: splits/pooled_v1.json
  data_root: data
  languages: [hi, bn, ta, te, mr, gu, kn, ml, pa, or, as, ur, en]

train:
  epochs: 15
  batch_size: 64
  lr: 1.0e-3
  hidden: 32

fairness:
  threshold: 0.5
  max_fpr_gap: 0.05     # max allowed difference in bona fide FPR between languages
  enforce: true         # fail the run if the gap is exceeded (B6-T06 release gate)
