# Base model: frozen XLS-R 300M (layers 5-9) + Nes2Net back-end, trained on cached features
# from the ASVspoof 5 train partition, early-stopped on dev. Sized for an 8 GB laptop GPU
# (RTX 4060) and ~135 GB of feature cache on E:. Guide: docs/TRAINING_GUIDE.md
run_name: head_a_base
lineage: research           # research | commercial
allow_noncommercial: true   # license gate (I7); keeps the research lineage explicit
seed: 1337
out_dir: runs

frontend: facebook/wav2vec2-xls-r-300m
frontend_revision: null     # recorded automatically from the downloaded weights (checkpoint meta)
frontend_layers: [5, 6, 7, 8, 9]
freeze_frontend: true
backend: nes2net
emb_dim: 160
loss: oc_softmax
version: 0.1.0              # model version: A@xlsr300m-nes2net-v0.1.0

data:
  manifests: data/manifests/asvspoof5_*.jsonl
  splits: splits/asvspoof5.json
  data_root: data

cache:
  dir: data/features/xlsr300m_L5-9
  batch: 24                 # GPU batch for extraction; halves itself on out-of-memory
  workers: 6                # CPU processes decoding FLAC in parallel (you have 16 threads)
  train:                    # ~18.5k bona fide + 5000 x 8 attacks ~= 58k clips ~= 119 GB
    max_bona: null          # null = all bona fide
    spoof_per_family: 5000
  dev:                      # ~8k clips ~= 16 GB
    max_bona: 4000
    spoof_per_family: 500

train:
  epochs: 30
  batch_size: 64
  lr: 3.0e-4
  weight_decay: 1.0e-4
  patience: 6               # early stop after 6 epochs without a better dev EER
  feature_mask_prob: 0.5    # feature-space augmentation (time + channel masks)
  num_workers: 4
  seconds: 4.0
