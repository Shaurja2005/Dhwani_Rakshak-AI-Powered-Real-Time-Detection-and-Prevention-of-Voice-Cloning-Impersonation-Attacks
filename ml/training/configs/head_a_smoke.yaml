# Pipeline smoke test: tiny random-init front-end on synthetic toy audio. CPU, ~1 min.
# Proves the training loop, checkpointing and head loading work. NOT a detector.
run_name: head_a_smoke
lineage: research
allow_noncommercial: true
seed: 7
out_dir: runs
device: cpu

frontend: tiny
frontend_layers: [3, 4, 5, 6]
freeze_frontend: false
backend: nes2net
emb_dim: 32
loss: oc_softmax
version: 0.0.1

data:
  source: synthetic
  n_train: 64
  n_dev: 32

augment:
  rawboost_algo: 0

train:
  epochs: 3
  batch_size: 8
  seconds: 2.0
  lr: 1.0e-3
  num_workers: 0
  balance_families: true

robust: {}
